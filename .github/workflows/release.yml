name: Release
# A release tag is published only after the complete reusable CI workflow succeeds.
on:
  push:
    tags: [ 'v*' ]
permissions:
  contents: write
jobs:
  tests:
    name: Full CI before publishing
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  build:
    name: Build, sign and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CHANGELOG before release
        run: sh tools/check-release.sh "${GITHUB_REF_NAME}"
      - name: Make sure the tag was released from main
        run: |
          set -eu
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::The release tag must point to a commit that is already in main."
            exit 1
          }
      - name: Prepare release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            index($0, "## v" version " · ") == 1 {
              if (!found) {
                found=1
                print "# Nightfall v" version
                print ""
                next
              }
            }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Build the release archive
        run: VERSION="${GITHUB_REF_NAME}" sh build-release.sh
      - name: Check the archive and checksum
        run: |
          set -eu
          test -s dist/nightfall-root.tar.gz
          test -s dist/nightfall-root.tar.gz.sha256
          (cd dist && sha256sum -c nightfall-root.tar.gz.sha256)
          tar -tzf dist/nightfall-root.tar.gz | grep -q 'www/luci-static/nightfall/version.json'
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_VERSION=$(tar -xOf dist/nightfall-root.tar.gz ./www/luci-static/nightfall/version.json | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          test -n "$ARCHIVE_VERSION"
          test "$ARCHIVE_VERSION" = "$EXPECTED_VERSION" || {
            echo "::error::Archive version ($ARCHIVE_VERSION) does not match the tag ($EXPECTED_VERSION)."
            exit 1
          }
      # Sign with usign, the same tool the router uses to verify the archive.
      - name: Sign the archive
        env:
          SIGN_KEY: ${{ secrets.NIGHTFALL_SIGN_KEY }}
        run: |
          set -eu
          [ -n "$SIGN_KEY" ] || { echo "::error::NIGHTFALL_SIGN_KEY secret is missing; refusing to publish an unsigned release"; exit 1; }
          sudo apt-get install -y cmake >/dev/null
          git clone --depth 1 https://github.com/openwrt/usign.git /tmp/usign
          cmake -S /tmp/usign -B /tmp/usign/b >/dev/null
          make -C /tmp/usign/b >/dev/null
          umask 077
          printf '%s\n' "$SIGN_KEY" > /tmp/nf.key
          /tmp/usign/b/usign -S -m dist/nightfall-root.tar.gz -s /tmp/nf.key -x dist/nightfall-root.tar.gz.sig
          rm -f /tmp/nf.key
          /tmp/usign/b/usign -V -m dist/nightfall-root.tar.gz -p luci-theme-nightfall/root/etc/nightfall-release.pub -x dist/nightfall-root.tar.gz.sig
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/nightfall-root.tar.gz
            dist/nightfall-root.tar.gz.sha256
            dist/nightfall-root.tar.gz.sig
          body_path: release-notes.md
          generate_release_notes: false
      - name: Update latest.json for a stable release
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          printf '{ "version": "%s" }\n' "${GITHUB_REF_NAME#v}" > latest.json
          git add latest.json
          git diff --cached --quiet || {
            git commit -m "latest.json: ${GITHUB_REF_NAME}"
            git push origin main
          }
